
# Configuration file for the Tasks and methods in the model pipeline(s)
# This includes all the scripts in the 'model' folder and subfolders

# General settings --------------------------------------

random_seed: 42  # Seed for reproducibility
epsilon: 1e-6  # For clipping, e.g. to avoid exact 0 or 1 in beta distributed models

# Data type and scope --------------------------------------

data_scope:
  diversity_type: beta  # [alpha, beta]
  reference_baseline: minimal_primary_vegetation  # [minimal_primary_vegetation, primary_vegetation]
  min_sites_per_study: 10  # Min number of sites per study to be included in model
  min_ref_sites_for_beta: 3  # Min nb of reference sites for beta diversity models
  exclude_outliers: True  # Use IQR / Tukey rule to exclude outliers in target
  iqr_multiplier: 1.5  # Multiplier for IQR to define outliers
  sub_sampling:
    fraction: 0.10  # Fraction of data to include for beta diversity defaults
    level: sites  # [sites, studies]
    min_k_per_study: 400  # For beta: min target number of sites per study
    max_k_per_study: 2000  # For beta: max target number of sites per study

  biogeographic:  # Biogeographic scope on which to train model
    include_all: True  # True if global scope, False if non-global
    filtering_logic: include  # Either include or exclude biomes listed below
    filtering_dicts:  # Only applicable if global is False
      Biome:  # Include / exclude the following biomes
        #- Tropical & Subtropical Moist Broadleaf Forests
        #- Tropical & Subtropical Dry Broadleaf Forests
        #- Tropical & Subtropical Coniferous Forests
        #- Temperate Broadleaf & Mixed Forests
        - Tropical & Subtropical Grasslands, Savannas & Shrublands
        #- Mediterranean Forests, Woodlands & Shrubs
      Realm:
        #- Neotropic
        #- Indo-Malay
        #- Afrotropic

  taxonomic:  # Taxonomic scope on which to train model
    resolution: All_species  # Determines scope and possible granularity of filtering
    # [All_species, Custom, Custom_alt, Kingdom, Phylum, Class, Order]
    filtering_scope: Custom  # For consistent filtering when resolution is All_species
    include_all: True  # True if all species in scope, False if not
    filtering_logic: include
    filtering_dicts:  # Can only filter down to the resolution specified above
      All_species: []  # No need to specify groups for 'All_species'
      Custom: []
      Custom_alt: []
      Kingdom:  # Include / exclude the following species groups
        - Animalia
        - Plantae
        - Fungi
      Phylum: []  # Must be specified if building a model at these levels
      Class: []
      Order: []
      Family: []


# Run and model structure settings --------------------------------------

run_settings:

  # Model type and covariates to be used
  model_type: bayesian  # [bayesian, glmm]
  model_variables: beta_main_predominant_lu  # See below for model configurations

  # Structural settings for Bayesian hierarchical models
  bayesian:
    prior_predictive_checks: False  # True if prior predictive checks should be run
    prior_predictive_plot_pairs:
      - [prior, mu_alpha]
      - [prior, mu_beta]
      - [prior, alpha_1]
      - [prior, beta_1]
      - [prior, alpha_2]
      - [prior, beta_2]
      - [prior_predictive, y_like]
      - [observed_data, y_like]
    sampling_statistics: True  # Calculate ESS and R-hat statistics
    save_models_and_traces: False  # Save PyMC model objects and traces to disk (can be large)
    save_predictive_distributions: False  # Save full predictive distributions (very large)

    hierarchical_levels: 3 # Number of hierarchical levels: [1, 2, 3]
    varying_slope_level: 3  # Most granular level at which varying slopes are fitted
    rolled_up_predictions: True  # Predictions use higher level params for small groups
    study_effect_centering: global  # Study random-effect centering: [global, ecological_group]
    study_effect_centering_level: deepest  # Hierarchy level for ecological_group centering
    ecological_group_dispersion: False  # Allow beta dispersion to vary by ecological group
    ecological_group_dispersion_level: deepest  # Hierarchy level for group dispersion
    min_studies_per_group: 5  # Min studies needed to predict at a hierarchy group
    min_sites_per_group: 100  # Min unique focal sites needed for hierarchy group
    min_ref_sites_per_group: 5  # Min unique beta reference sites, if available
    hierarchy:  # Columns that define hierarchy; levels below the number above ignored
      level_1: [Biome]  # e.g. [Biome, Realm]
      level_2: [Realm]  # e.g. [Custom_taxonomic_group]
      level_3: [Custom_taxonomic_group]

    # Model fixed / random effects structure
    training_components:
      ecological: True
      study_intercept: False
      study_slopes: False
      block_intercept: False

    prediction_components:
      ecological: True
      study_intercept: False
      study_slopes: False
      block_intercept: False

    # Use a named model_variables entry for study slopes.
    study_effects: alpha_glmm

    likelihood: beta  # [gaussian, beta]
    priors:
      group_size_shrinkage: True  # Apply shrinkage to group-level effects based on size
      group_size_shrinkage_scaling: log  # [sqrt, log]
      group_size_shrinkage_max_scale: 1.0  # Cap prior scaling for all CV modes
      gaussian:
        alpha_hyper_mean: 0.5
        hyperprior_sd_alpha: 0.15
        group_prior_sd_alpha: 0.10
        hyperprior_sd_beta: 0.10
        group_prior_sd_beta_level_1: 0.10
        group_prior_sd_beta_level_2: 0.05
        group_prior_sd_beta_level_3: 0.05
        random_intercept_sd: 0.20
        random_slope_sd: 0.10
        sigma_y_sd: 0.20

      beta:
        alpha_hyper_mean_mu: 0.35  # Response mean on data scale; beta-diversity experiments override to 0.25
        hyperprior_sd_alpha: 0.25  # Population intercept prior SD on latent scale
        group_prior_sd_alpha: 0.15  # Ecological group intercept prior SD on latent scale
        hyperprior_sd_beta: 0.18  # Population slope prior SD on latent scale
        group_prior_sd_beta_level_1: 0.07  # Level-1 ecological slope prior SD
        group_prior_sd_beta_level_2: 0.05  # Level-2 ecological slope prior SD
        group_prior_sd_beta_level_3: 0.03  # Level-3 ecological slope prior SD
        random_intercept_sd: 0.1  # Study/block random intercept prior SD
        random_slope_sd: 0.05  # Study random slope prior SD
        ecological_group_dispersion_sd: 0.5  # Logit-scale SD for group dispersion deviations
        beta_likelihood:
          alpha: 2
          beta: 12  # Alpha training/standard CV; experiments override other cases

    sampler:  # Refer to PyMC documentation for all settings
      draws: 1000
      tune: 1000
      cores: 4
      chains: 4
      target_accept: 0.95
      nuts_sampler: numpyro  # [numpyro, pymc]

  # Structural settings for generalized linear mixed models
  glmm:
    family: beta  # [beta, gaussian]
    link: logit  # [logit, identity]
    random_effects_type: independent  # [independent, correlated]
    study_effects:
      type: slope  # [intercept, slope]
    block_effects:
      type: intercept  # [intercept, slope, null]
    effect_ci:
      method: Wald  # [Wald, bootstrap]
      n_boot: 50  # Only used when method=bootstrap


# Cross-validation settings --------------------------------------

cv_settings:
  k: 5  # Number of folds
  split_level: study  # [site, study]
  stratification_cols: [Biome]  # Variables to stratify on
  # Biome, Custom_taxonomic_group, Realm


