sbm_alpha_training_main:
  dag: training
  overrides:
    data_scope:
      diversity_type: alpha
      sub_sampling:
        fraction: 1.0
      taxonomic:
        resolution: Custom

    run_settings:
      model_type: bayesian
      model_variables: alpha_main
      bayesian:
        rolled_up_predictions: False
        study_effects: alpha_glmm
        training_components:
          ecological: False
          study_intercept: True
          study_slopes: True
          block_intercept: True
        prediction_components:
          ecological: False
          study_intercept: True
          study_slopes: True
          block_intercept: True

