sbm_alpha_training_main:
  dag: training
  overrides:
    data_scope:
      diversity_type: alpha
      sub_sampling:
        fraction: 1.0
      taxonomic:
        resolution: All_species
        filtering_scope: Custom
    run_settings:
      model_type: bayesian
      model_variables: alpha_main
      bayesian:
        hierarchy:
          level_1:
          - Biome
          level_2:
          - Realm
          level_3: []
        rolled_up_predictions: false
        study_effects: alpha_glmm
        training_components:
          ecological: false
          study_intercept: true
          study_slopes: true
          block_intercept: true
        prediction_components:
          ecological: false
          study_intercept: true
          study_slopes: true
          block_intercept: true
        priors:
          beta:
            hyperprior_sd_alpha: 1.0
            hyperprior_sd_beta: 1.0
            random_intercept_sd: 1.0
            random_slope_sd: 1.0
