sbm_beta_training_main:
  dag: training
  overrides:
    data_scope:
      diversity_type: beta
      sub_sampling:
        fraction: 0.15
      taxonomic:
        resolution: Custom

    run_settings:
      model_type: bayesian
      model_variables: beta_main
      bayesian:
        rolled_up_predictions: False
        study_effects: beta_glmm
        priors:
          beta:
            alpha_hyper_mean_mu: 0.25
            hyperprior_sd_alpha: 0.25
            group_prior_sd_alpha: 0.15
            beta_likelihood:
              beta: 20
        training_components:
          ecological: False
          study_intercept: True
          study_slopes: True
          block_intercept: True
        prediction_components:
          ecological: False
          study_intercept: True
          study_slopes: True
          block_intercept: True

