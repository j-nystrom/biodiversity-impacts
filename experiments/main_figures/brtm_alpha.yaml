brtm_alpha_training_main:
  dag: training
  overrides:
    data_scope:
      diversity_type: alpha
      sub_sampling:
        fraction: 1.0
      taxonomic:
        resolution: Custom

    run_settings:
      model_type: bayesian
      model_variables: alpha_main
      bayesian:
        hierarchical_levels: 2
        varying_slope_level: 2
        rolled_up_predictions: True
        min_studies_per_group: 5
        hierarchy:
          level_1: [Biome, Custom_taxonomic_group]
          level_2: [Realm]
          level_3: []
        training_components:
          ecological: True
          study_intercept: False
          study_slopes: False
          block_intercept: False
        prediction_components:
          ecological: True
          study_intercept: False
          study_slopes: False
          block_intercept: False

