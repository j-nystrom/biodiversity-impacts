brtm_beta_training_main:
  dag: training
  overrides:
    data_scope:
      diversity_type: beta
      sub_sampling:
        fraction: 0.15
      taxonomic:
        resolution: Custom
    run_settings:
      model_type: bayesian
      model_variables: beta_main
      bayesian:
        hierarchical_levels: 2
        varying_slope_level: 2
        rolled_up_predictions: true
        min_studies_per_group: 5
        hierarchy:
          level_1:
          - Biome
          - Custom_taxonomic_group
          level_2:
          - Realm
          level_3: []
        priors:
          beta:
            alpha_hyper_mean_mu: 0.25
            hyperprior_sd_alpha: 0.25
            group_prior_sd_alpha: 0.15
            beta_likelihood:
              beta: 20
        training_components:
          ecological: true
          study_intercept: false
          study_slopes: false
          block_intercept: false
        prediction_components:
          ecological: true
          study_intercept: false
          study_slopes: false
          block_intercept: false
