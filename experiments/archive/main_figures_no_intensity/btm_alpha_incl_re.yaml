btm_alpha_training_incl_re_no_intensity:
  dag: training
  overrides:
    data_scope:
      diversity_type: alpha
      sub_sampling:
        fraction: 1.0
      taxonomic:
        resolution: Custom_alt
      reference_baseline: primary_vegetation
    run_settings:
      model_type: bayesian
      model_variables: alpha_main_predominant_lu
      bayesian:
        hierarchical_levels: 2
        varying_slope_level: 2
        rolled_up_predictions: true
        min_studies_per_group: 5
        hierarchy:
          level_1:
          - Biome
          level_2:
          - Custom_taxonomic_group_alt
          level_3: []
        study_effects:
          slope_terms:
          - Young secondary vegetation
          - Intermediate secondary vegetation
          - Mature secondary vegetation
          - Secondary vegetation (indeterminate age)
          - Plantation forest
          - Pasture
          - Cropland
          - Urban
          - Pop_density_10km_log
          - Road_density_10km_log
        training_components:
          ecological: true
          study_intercept: true
          study_slopes: true
          block_intercept: false
        prediction_components:
          ecological: true
          study_intercept: true
          study_slopes: true
          block_intercept: false
        priors:
          beta:
            random_intercept_sd: 0.1
            random_slope_sd: 0.05
