glmm_beta_training_main:
  dag: training
  overrides:
    data_scope:
      diversity_type: beta
      sub_sampling:
        fraction: 0.15
      taxonomic:
        resolution: All_species
        filtering_scope: Custom
    run_settings:
      model_type: glmm
      model_variables: beta_glmm
      glmm:
        family: beta
        link: logit
        random_effects_type: independent
        study_effects:
          type: slope
        block_effects:
          type: intercept
        effect_ci:
          method: Wald
          n_boot: 50
