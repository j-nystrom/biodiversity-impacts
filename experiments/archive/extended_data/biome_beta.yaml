biome_beta_training_ecol:
  dag: training
  overrides:
    data_scope:
      diversity_type: beta
      sub_sampling:
        fraction: 0.15
      taxonomic:
        resolution: All_species
        filtering_scope: Custom
    run_settings:
      model_type: bayesian
      model_variables: beta_main
      bayesian:
        hierarchical_levels: 1
        varying_slope_level: 1
        rolled_up_predictions: true
        min_studies_per_group: 5
        hierarchy:
          level_1:
          - Biome
          level_2: []
          level_3: []
        study_effects: beta_glmm
        priors:
          beta:
            alpha_hyper_mean_mu: 0.25
            beta_likelihood:
              beta: 20
        training_components:
          ecological: true
          study_intercept: false
          study_slopes: false
          block_intercept: false
        prediction_components:
          ecological: true
          study_intercept: false
          study_slopes: false
          block_intercept: false
