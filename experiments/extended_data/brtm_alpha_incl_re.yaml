brtm_alpha_training_incl_re:
  dag: training
  overrides:
    data_scope:
      diversity_type: alpha
      sub_sampling:
        fraction: 1.0
      taxonomic:
        resolution: Custom
    run_settings:
      model_type: bayesian
      model_variables: alpha_main
      bayesian:
        hierarchical_levels: 2
        varying_slope_level: 2
        rolled_up_predictions: true
        min_studies_per_group: 5
        hierarchy:
          level_1:
          - Biome
          - Custom_taxonomic_group
          level_2:
          - Realm
          level_3: []
        study_effects: alpha_glmm
        training_components:
          ecological: true
          study_intercept: true
          study_slopes: true
          block_intercept: true
        prediction_components:
          ecological: true
          study_intercept: true
          study_slopes: true
          block_intercept: true
        priors:
          beta:
            random_intercept_sd: 0.1
            random_slope_sd: 0.05
