  overrides:
    data_scope:
      diversity_type: beta
      sub_sampling:
        fraction: 0.15
      taxonomic:
        resolution: Custom
    run_settings:
      model_type: bayesian
      model_variables: beta_main
      bayesian:
        hierarchical_levels: 1
        varying_slope_level: 1
        rolled_up_predictions: true
